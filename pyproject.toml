[project]
name = "aidevs4"
version = "0.1.0"
description = "aidevs4 project"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.74.0",
    "pillow>=11.0.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidevs4"]
